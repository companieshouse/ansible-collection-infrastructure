---
- name: Validate PCPlus Quarterly Update
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    s3_new_path: "s3://{{ pcplus_s3_bucket }}/{{ pcplus_s3_prefix }}/{{ pcplus_new_folder }}/"
    s3_old_path: "s3://{{ pcplus_s3_bucket }}/{{ pcplus_s3_prefix }}/{{ pcplus_old_folder }}/"
    ec2_new_path: "{{ pcplus_ec2_install_path }}/data_{{ pcplus_new_folder }}"
    ec2_live_path: "{{ pcplus_ec2_install_path }}/data"

  tasks:

    ######################################################################
    # 1. Validate NEW S3 quarter exists
    ######################################################################
    - name: Check if new S3 quarter folder exists
      ansible.builtin.command:
        cmd: aws s3 ls "{{ s3_new_path }}"
      register: s3_new_check
      failed_when: s3_new_check.rc != 0
      changed_when: false

    - name: Assert new S3 folder exists
      ansible.builtin.assert:
        that:
          - "'PRE' in s3_new_check.stdout or s3_new_check.stdout != ''"
        fail_msg: "New S3 quarter directory {{ s3_new_path }} was NOT found."
        success_msg: "New S3 quarter directory verified."

    ######################################################################
    # 2. Validate OLD S3 quarter was deleted
    ######################################################################
    - name: Check if old S3 quarter folder still exists
      ansible.builtin.command:
        cmd: aws s3 ls "{{ s3_old_path }}"
      register: s3_old_check
      changed_when: false
      failed_when: false

    - name: Assert old S3 folder removed
      ansible.builtin.assert:
        that:
          - s3_old_check.stdout == ""
        fail_msg: "Old S3 quarter {{ s3_old_path }} still exists and should have been deleted."
        success_msg: "Old S3 quarter directory correctly deleted."

    ######################################################################
    # 3. Validate EC2 directory created
    ######################################################################
    - name: Check EC2 new directory exists
      ansible.builtin.stat:
        path: "{{ ec2_new_path }}"
      register: ec2_dir

    - name: Assert EC2 directory exists
      ansible.builtin.assert:
        that:
          - ec2_dir.stat.exists
        fail_msg: "EC2 directory {{ ec2_new_path }} does not exist."
        success_msg: "EC2 directory exists."

    ######################################################################
    # 4. Validate license file
    ######################################################################
    - name: Check for license file in new directory
      ansible.builtin.stat:
        path: "{{ ec2_new_path }}/pcplus.lic"
      register: lic_file

    - name: Assert license file exists
      ansible.builtin.assert:
        that:
          - lic_file.stat.exists
        fail_msg: "pcplus.lic missing in {{ ec2_new_path }}"
        success_msg: "License file present."

    ######################################################################
    # 5. Validate permissions (755 root:root)
    ######################################################################
    - name: Get permissions of new directory
      ansible.builtin.stat:
        path: "{{ ec2_new_path }}"
      register: ec2_perm

    - name: Assert permissions correct
      ansible.builtin.assert:
        that:
          - ec2_perm.stat.mode == "0755"
          - ec2_perm.stat.pw_name == "root"
          - ec2_perm.stat.gr_name == "root"
        fail_msg: "Permissions incorrect on {{ ec2_new_path }}"
        success_msg: "Permissions OK (755 root:root)."

    ######################################################################
    # 6. Validate rotation (data -> data_<quarter> -> data)
    ######################################################################
    - name: Check live directory is the new quarter
      ansible.builtin.stat:
        path: "{{ ec2_live_path }}"
      register: live_dir

    - name: Assert live data folder points to updated quarter
      ansible.builtin.assert:
        that:
          - live_dir.stat.exists
        fail_msg: "Live directory {{ ec2_live_path }} missing after rotation."
        success_msg: "Live directory present."

    ######################################################################
    # 7. Validate S3 vs EC2 file count match
    ######################################################################
    - name: Count S3 objects
      ansible.builtin.command:
        cmd: aws s3 ls "{{ s3_new_path }}" --recursive | wc -l
      register: s3_count
      changed_when: false

    - name: Count EC2 files
      ansible.builtin.command:
        cmd: find "{{ ec2_new_path }}" -type f | wc -l
      register: ec2_count
      changed_when: false

    - name: Assert file counts match
      ansible.builtin.assert:
        that:
          - s3_count.stdout | int == ec2_count.stdout | int
        fail_msg: >
          S3 objects ({{ s3_count.stdout }}) and EC2 files ({{ ec2_count.stdout }}) DO NOT MATCH.
        success_msg: >
          File count matches between S3 and EC2.
