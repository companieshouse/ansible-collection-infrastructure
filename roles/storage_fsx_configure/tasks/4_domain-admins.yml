---
- name: Refuse to proceed without domain admins
  ansible.builtin.assert:
    that:
      - storage_fsx_configure_domain_admins is sequence
      - storage_fsx_configure_domain_admins is not string
      - storage_fsx_configure_domain_admins | length > 0
    fail_msg: >-
      storage_fsx_configure_domain_admins is empty
      Stopping here to avoid potentially removing every existing admin
    quiet: true

- name: Configure domain tunnel for AD authentication
  netapp.ontap.na_ontap_domain_tunnel:
    state: present
    vserver: "{{ storage_fsx_configure_vserver }}"

- name: Get current security login users
  netapp.ontap.na_ontap_rest_info:
    gather_subset:
      - security/accounts
    fields:
      - name
      - applications
      - role
      - scope
  register: storage_fsx_configure_security_logins

- name: Build set of currently-configured domain admins
  ansible.builtin.set_fact:
    storage_fsx_configure_current_domain_admins: >-
      {{ storage_fsx_configure_security_logins.ontap_info['security/accounts'].records
         | selectattr('scope', 'equalto', 'cluster')
         | map(attribute='name')
         | select('search', backslash)
         | map('regex_replace', '^[^' ~ backslash ~ ']+' ~ backslash, '')
         | map('lower')
         | list }}
  vars:
    backslash: '{{ "\\" }}'

- name: Build lowercased desired list (for comparison)
  ansible.builtin.set_fact:
    storage_fsx_configure_desired_lower: "{{ storage_fsx_configure_domain_admins | map('lower') | list }}"

- name: Determine which admins to add
  ansible.builtin.set_fact:
    storage_fsx_configure_admins_to_add: >-
      {{ storage_fsx_configure_domain_admins
         | zip(storage_fsx_configure_desired_lower)
         | rejectattr('1', 'in', storage_fsx_configure_current_domain_admins)
         | map(attribute='0')
         | list }}

- name: Determine which admins to remove
  ansible.builtin.set_fact:
    storage_fsx_configure_admins_to_remove: >-
      {{ storage_fsx_configure_current_domain_admins
         | difference(storage_fsx_configure_desired_lower) }}

- name: Show admin users diff
  ansible.builtin.debug:
    msg:
      current: "{{ storage_fsx_configure_current_domain_admins }}"
      desired: "{{ storage_fsx_configure_domain_admins }}"
      to_add: "{{ storage_fsx_configure_admins_to_add }}"
      to_remove: "{{ storage_fsx_configure_admins_to_remove }}"

- name: Add new domain admins
  netapp.ontap.na_ontap_user:
    state: present
    name: "{{ storage_fsx_configure_cifs_domain }}\\{{ item }}"
    vserver: "{{ storage_fsx_configure_cluster_name }}"
    applications: ssh
    authentication_method: domain
    role_name: fsxadmin
  loop: "{{ storage_fsx_configure_admins_to_add }}"
  loop_control:
    label: "{{ item }}"

- name: Remove existing admin users not present in desired list
  netapp.ontap.na_ontap_user:
    state: absent
    name: "{{ storage_fsx_configure_cifs_domain }}\\{{ item }}"
    vserver: "{{ storage_fsx_configure_cluster_name }}"
    applications: ssh
    authentication_method: domain
  loop: "{{ storage_fsx_configure_admins_to_remove }}"
  loop_control:
    label: "{{ item }}"
