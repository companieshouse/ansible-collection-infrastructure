
---
- block:
    - name: Create new quarter directory
      file:
        path: "{{ pcplus_dir }}/data_{{ current_quarter }}"
        state: directory
        mode: "0755"

    - name: Download quarterly data from S3
      command: >
        aws s3 cp --recursive s3://{{ bucket_name }}/{{ s3_pcplus_prefix }}/{{ current_quarter }}/ {{ pcplus_dir }}/data_{{ current_quarter }}/ --profile {{ aws_profile_heritage }}
      register: dl
      failed_when: dl.rc != 0

    - name: Check for licence
      command: "ls {{ pcplus_dir }}/data_{{ current_quarter }}"
      register: files
      failed_when: files.rc != 0

    - name: Copy licence if missing
      command: >
        cp {{ pcplus_dir }}/pcplus.lic {{ pcplus_dir }}/data_{{ current_quarter }}/
      when: "'pcplus.lic' not in files.stdout"

    - name: Fix permissions
      file:
        path: "{{ pcplus_dir }}/data_{{ current_quarter }}"
        owner: root
        group: root
        mode: "0755"
        recurse: yes

    - name: Backup existing data folder
      command: >
        mv {{ pcplus_dir }}/data {{ pcplus_dir }}/data_backup_{{ ansible_date_time.epoch }}
      ignore_errors: yes

    - name: Promote new data
      command: >
        mv {{ pcplus_dir }}/data_{{ current_quarter }} {{ pcplus_dir }}/data
      register: mvres
      failed_when: mvres.rc != 0

    - name: Test postcode lookup
      command: >
        {{ pcplus_dir }}/bin_linux64/console/addresslookup postcode="LA95FT"
      register: lookup
      failed_when: lookup.rc != 0

  rescue:
    - debug:
        msg: " EC2 update failed"
    - meta: end_play

  always:
    - debug:
        msg: "ℹ️ EC2 update block completed"
