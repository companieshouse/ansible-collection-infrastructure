---
- name: Assert at least one NFS mount has been provided
  ansible.builtin.assert:
    that:
      - storage_nfs_mounts | length > 0
    fail_msg: "storage_nfs_mounts must contain at least one mount definition."
    quiet: true

- name: Assert this is a RHEL-compatible host
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
    fail_msg: >-
      storage_nfs currently only intended for use on RHEL-family hosts
      (detected ansible_os_family='{{ ansible_os_family | default("unknown") }}').
    quiet: true

- name: Assert every mount definition has its required fields
  ansible.builtin.assert:
    that:
      - item.server | default('') | trim | length > 0
      - item.export_path | default('') | trim | length > 0
      - item.mount_point | default('') | trim | length > 0
      - item.mount_point is match('^/')
    fail_msg: >-
      Each entry in storage_nfs_mounts needs a non-empty 'server',
      'export_path' and absolute 'mount_point'. Offending entry: {{ item }}
    quiet: true
  loop: "{{ storage_nfs_mounts }}"
  loop_control:
    label: "{{ item.mount_point | default('<no mount_point>') }}"

- name: Install NFS utilities
  ansible.builtin.package:
    name: nfs-utils
    state: present

- name: Enable and start rpcbind socket
  ansible.builtin.systemd:
    name: rpcbind.socket
    enabled: true
    state: started

- name: Check which points are already mounted
  ansible.builtin.command: findmnt --kernel --mountpoint {{ item.mount_point | quote }}
  register: storage_nfs_mount_check
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ storage_nfs_mounts }}"
  loop_control:
    label: "{{ item.mount_point }}"

- name: Ensure mount point directories exist
  ansible.builtin.file:
    path: "{{ item.0.mount_point }}"
    state: directory
    owner: "{{ item.0.owner | default(storage_nfs_mount_owner) }}"
    group: "{{ item.0.group | default(storage_nfs_mount_group) }}"
    mode: "{{ item.0.mode | default(storage_nfs_mount_mode) }}"
  loop: "{{ storage_nfs_mounts | zip(storage_nfs_mount_check.results) | list }}"
  loop_control:
    label: "{{ item.0.mount_point }}"
  when: item.1.rc != 0

- name: Configure NFS mounts in fstab and mount them
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    src: "{{ item.server }}:{{ item.export_path }}"
    fstype: nfs
    opts: "{{ item.opts | default(storage_nfs_mount_opts) }}"
    state: mounted
  loop: "{{ storage_nfs_mounts }}"
  loop_control:
    label: "{{ item.server }}:{{ item.export_path }} -> {{ item.mount_point }}"
