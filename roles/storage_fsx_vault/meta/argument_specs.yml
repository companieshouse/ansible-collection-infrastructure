---
argument_specs:
  main:
    short_description: Loads FSx variables from HashiCorp Vault and sets them as facts.
    description:
      - Loads FSx related variables from HashiCorp Vault and exposes them as
        Ansible facts; intended to be used in conjunction with `storage_fsx_configure`.
      - List-valued fields (`dns_servers`, `domain_admins`) must be stored in
        Vault as native lists; JSON-encoded strings are rejected.
    options:
      storage_fsx_vault_base_path:
        type: str
        required: true
        description: >-
          Base path which contains /configs, /credentials, and /admins
