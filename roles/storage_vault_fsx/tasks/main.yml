---
- name: Validate Vault path inputs are set
  ansible.builtin.assert:
    that:
      - lookup('vars', item, default='') | trim | length > 0
    fail_msg: >-
      '{{ item }}' must be set. In CI this is injected by the Concourse
      task. For local runs, pass both via the playbook's role vars or as
      extra-vars:
      ansible-playbook
      --extra-vars storage_vault_fsx_aws_profile= my-dev-dev-eu-west-1
      --extra-vars storage_vault_fsx_fsx_name=nfs-fsx
      playbook.yml
  loop:
    - storage_vault_fsx_aws_profile
    - storage_vault_fsx_fsx_name
  loop_control:
    label: "{{ item }}"

- name: Validate Vault AppRole auth env vars are present
  ansible.builtin.assert:
    that:
      - lookup('env', item) | length > 0
    fail_msg: >-
      Environment variable '{{ item }}' is not set. Vault AppRole
      authentication requires ANSIBLE_HASHI_VAULT_ADDR,
      ANSIBLE_HASHI_VAULT_ROLE_ID, and ANSIBLE_HASHI_VAULT_SECRET_ID
      to be exported.
  loop:
    - ANSIBLE_HASHI_VAULT_ADDR
    - ANSIBLE_HASHI_VAULT_ROLE_ID
    - ANSIBLE_HASHI_VAULT_SECRET_ID
  loop_control:
    label: "{{ item }}"

- name: Retrieve FSx config bundle from Vault
  ansible.builtin.set_fact:
    storage_vault_fsx_config_bundle: "{{ lookup('community.hashi_vault.vault_kv2_get', storage_vault_fsx_vault_base_path + '/config').secret }}"
  no_log: true

- name: Set config facts
  ansible.builtin.set_fact:
    storage_vault_fsx_netapp_hostname: "{{ storage_vault_fsx_config_bundle.netapp_hostname }}"
    storage_vault_fsx_cifs_server_name: "{{ storage_vault_fsx_config_bundle.cifs_server_name }}"
    storage_vault_fsx_dns_servers: "{{ storage_vault_fsx_config_bundle.dns_servers | from_json }}"
  no_log: true

- name: Retrieve FSx credentials bundle from Vault
  ansible.builtin.set_fact:
    storage_vault_fsx_credentials_bundle: "{{ lookup('community.hashi_vault.vault_kv2_get', storage_vault_fsx_vault_base_path + '/credentials').secret }}"
  no_log: true

- name: Set credential facts
  ansible.builtin.set_fact:
    storage_vault_fsx_netapp_username: "{{ storage_vault_fsx_credentials_bundle.fsxadmin_username }}"
    storage_vault_fsx_netapp_password: "{{ storage_vault_fsx_credentials_bundle.fsxadmin_password }}"
    storage_vault_fsx_dc_admin_user_name: "{{ storage_vault_fsx_credentials_bundle.ad_join_username }}"
    storage_vault_fsx_dc_admin_password: "{{ storage_vault_fsx_credentials_bundle.ad_join_password }}"
  no_log: true

- name: Retrieve domain admins bundle from Vault
  ansible.builtin.set_fact:
    storage_vault_fsx_admins_bundle: "{{ lookup('community.hashi_vault.vault_kv2_get', storage_vault_fsx_vault_base_path + '/admins').secret }}"
  no_log: true

- name: Set domain admins fact
  ansible.builtin.set_fact:
    storage_vault_fsx_fsx_domain_admins: "{{ storage_vault_fsx_admins_bundle.domain_admins | from_json }}"
  no_log: true
