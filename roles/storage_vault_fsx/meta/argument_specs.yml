---
argument_specs:
  main:
    short_description: Load FSx config and credentials from HashiCorp Vault.
    description:
      - Looks up FSx config, credentials, and domain admins from three KV2
        secrets under storage_vault_fsx_vault_base_path, and exposes them as
        Ansible facts. The consuming playbook is expected to map these
        outputs onto the storage_fsx_configure role's inputs.
    options:
      storage_vault_fsx_aws_profile:
        type: str
        required: true
        description: AWS profile/account name. Used to build storage_vault_fsx_vault_base_path.
      storage_vault_fsx_fsx_name:
        type: str
        required: true
        description: FSx filesystem name. Used to build storage_vault_fsx_vault_base_path.
      storage_vault_fsx_vault_base_path:
        type: str
        required: false
        description: >-
          Base path under which the /config, /credentials, and /admins KV2
          secrets live. Defaulted in defaults/main.yml from aws_profile and
          fsx_name. Override only if your Vault layout differs.
