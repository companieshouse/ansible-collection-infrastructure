---
pcplus_get_put_s3_work_dir: "/tmp/pcplus_work"
pcplus_get_put_s3_download_url: "https://download.afd.co.uk/Support/COMPA14.zip"

pcplus_get_put_s3_aws_region: "eu-west-2"
pcplus_get_put_s3_s3_bucket: "shared-services.eu-west-2.resources.ch.gov.uk"
pcplus_get_put_s3_s3_prefix: "pcplus"

pcplus_get_put_s3__year: "{{ ansible_date_time.year | int }}"
pcplus_get_put_s3__month: "{{ ansible_date_time.month | int }}"
pcplus_get_put_s3__q: "{{ (((pcplus_get_put_s3__month | int) - 1) // 3) + 1 }}"

#pcplus_get_put_s3_current_quarter: "{{(pcplus_get_put_s3__year | int) }}_Q{{ pcplus_get_put_s3__q }}"
#pcplus_get_put_s3_old_quarter: "{{ ((pcplus_get_put_s3__year | int) - 1) }}_Q{{ pcplus_get_put_s3__q }}"

pcplus_get_put_s3_current_quarter: "{{ (pcplus_get_put_s3__year | int) ~ '_Q' ~ (pcplus_get_put_s3__q | int) }}"
pcplus_get_put_s3_old_quarter: "{{ (pcplus_get_put_s3__year - 1 | int) ~ '_Q' ~ (pcplus_get_put_s3__q | int) }}"
