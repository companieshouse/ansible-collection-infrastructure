---
- name: Preflight | Ensure pcplus directory exists
  ansible.builtin.file:
    path: "{{ pcplus_run_server_update_pcplus_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Preflight | Check AWS CLI
  block:
    - name: Check for aws CLI
      ansible.builtin.command: aws --version
      register: pcplus_run_server_update__aws
      changed_when: false
      failed_when: pcplus_run_server_update__aws.rc != 0
  rescue:
    - name: Verify aws cli installation
      ansible.builtin.fail:
        msg: "AWS CLI missing on EC2"

- name: Create data_new directory
  ansible.builtin.file:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_new_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Validate and fetch PCPlus current quarter data
  block:

    - name: Check if current quarter data exists in S3
      ansible.builtin.command: >
        aws s3 ls
        s3://{{ pcplus_run_server_update_pcplus_bucket }}/pcplus/{{ pcplus_run_server_update_pcplus_quarter }}/data/
      register: pcplus_run_server_update_pcplus_s3_check
      changed_when: false
      failed_when: false

    - name: Copy current quarter data from S3
      ansible.builtin.command: >
        aws s3 cp --recursive
        s3://{{ pcplus_run_server_update_pcplus_bucket }}/pcplus/{{ pcplus_run_server_update_pcplus_quarter }}/data/
        {{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_new_dir }}
      register: pcplus_run_server_update_pcplus_copy_data
      retries: 3
      delay: 5
      until: pcplus_copy_data.rc == 0
      changed_when: "'download:' in pcplus_copy_data.stdout"
      failed_when: pcplus_copy_data.rc != 0
      when:
        - pcplus_s3_check.rc == 0
        - pcplus_s3_check.stdout != ""
      become: true

    - name: Fail if S3 data missing
      ansible.builtin.fail:
        msg: >
          Current quarter folder missing:
          s3://{{ pcplus_run_server_update_pcplus_bucket }}/pcplus/{{ pcplus_run_server_update_pcplus_quarter }}/data/
      when:
        - pcplus_s3_check.rc != 0 or pcplus_s3_check.stdout == ""

  rescue:
    - name: Fail whole operation if validation fails
      ansible.builtin.fail:
        msg: "Failed to validate or copy current quarter S3 data"


- name: Stat current data directory
  ansible.builtin.stat:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/data"
  register: pcplus_run_server_update_pcplus_current_data
  become: true


- name: Stat old backup nested data directory
  ansible.builtin.stat:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_old_dir }}/data"
  register: pcplus_run_server_update_pcplus_old_nested_data
  become: true

- name: Ensure old backup nested data directory is absent
  ansible.builtin.file:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_old_dir }}/data"
    state: absent
  when:
    - pcplus_old_nested_data.stat.exists
  become: true


- name: Promote new data and backup old data
  block:

    - name: Backup existing data directory
      ansible.builtin.command: >
        mv "{{ pcplus_run_server_update_pcplus_dir }}/data"
           "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_old_dir }}"
      register: pcplus_run_server_update_backup_mv
      when:
        - pcplus_current_data.stat.exists
        - pcplus_current_data.stat.isdir
      changed_when: backup_mv.rc == 0
      failed_when: backup_mv.rc != 0
      become: true

    - name: Move data_new into place as data
      ansible.builtin.command: >
        mv "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_new_dir }}"
           "{{ pcplus_run_server_update_pcplus_dir }}/data"
      register: pcplus_run_server_update__promote_mv
      changed_when: pcplus_run_server_update__promote_mv.rc == 0
      failed_when: pcplus_run_server_update__promote_mv.rc != 0
      become: true

  rescue:
    - name: Fail if data promotion fails
      ansible.builtin.fail:
        msg: "Failed to promote data_new to active data directory"

- name: Ensure correct permissions
  ansible.builtin.file:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/data"
    owner: root
    group: root
    mode: "0755"
    recurse: true
