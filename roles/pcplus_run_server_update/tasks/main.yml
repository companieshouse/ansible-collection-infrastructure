---
- name: Preflight | Ensure pcplus directory exists
  ansible.builtin.file:
    path: "{{ pcplus_run_server_update_pcplus_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Preflight | Check AWS CLI
  block:
    - name: Check for aws CLI
      ansible.builtin.command: aws --version
      register: pcplus_run_server_update__aws
      changed_when: false
      failed_when: pcplus_run_server_update__aws.rc != 0
  rescue:
    - name: Verify aws cli installation
      ansible.builtin.fail:
        msg: "AWS CLI missing on EC2"

- name: Create data_new directory
  ansible.builtin.file:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_new_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy quarterly PCPlus data from S3
  ansible.builtin.command: >
    aws s3 cp --recursive
    s3://{{ pcplus_run_server_update_pcplus_bucket }}/pcplus/{{ pcplus_run_server_update_pcplus_quarter }}/data
    {{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_new_dir }}/
    --region {{ pcplus_run_server_update_aws_region }}
  register: pcplus_copy_data
  retries: 3
  delay: 5
  until: pcplus_copy_data.rc == 0
  changed_when: "'download:' in pcplus_copy_data.stdout"
  failed_when: pcplus_copy_data.rc != 0
  become: true

- name: Copy pcplus.lic into data_new
  ansible.builtin.command: >
    aws s3 cp
    s3://{{ pcplus_run_server_update_pcplus_bucket }}/pcplus/pcplus.lic
    {{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_new_dir }}/pcplus.lic
    --region {{ pcplus_run_server_update_aws_region }}
  register: pcplus_copy_lic
  retries: 3
  delay: 5
  until: pcplus_copy_lic.rc == 0
  changed_when: "'download:' in pcplus_copy_lic.stdout"
  failed_when: pcplus_copy_lic.rc != 0
  become: true

- name: Stat current data directory
  ansible.builtin.stat:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/data"
  register: pcplus_current_data
  become: true

- name: Promote new data and backup old data
  block:

    - name: Backup existing data directory
      ansible.builtin.command: >
        mv "{{ pcplus_run_server_update_pcplus_dir }}/data"
           "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_old_dir }}"
      when:
        - pcplus_current_data.stat.exists
        - pcplus_current_data.stat.isdir
      become: true

    - name: Move data_new into place as data
      ansible.builtin.command: >
        mv "{{ pcplus_run_server_update_pcplus_dir }}/{{ pcplus_run_server_update_pcplus_new_dir }}"
           "{{ pcplus_run_server_update_pcplus_dir }}/data"
      become: true

  rescue:
    - name: Fail if data promotion fails
      ansible.builtin.fail:
        msg: "Failed to promote data_new to active data directory"

- name: Ensure correct permissions
  ansible.builtin.file:
    path: "{{ pcplus_run_server_update_pcplus_dir }}/data"
    owner: root
    group: root
    mode: "0755"
    recurse: true
