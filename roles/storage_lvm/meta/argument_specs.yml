---
argument_specs:
  main:
    short_description: Provision LVM-backed mount points on an EC2 host using EBS Purpose tags.
    description:
      - Provisions LVM-backed mount points on an EC2 host, by creating a
        partition, physical volume, volume group, logical volume, and
        filesystem, then mounts it at `/{{ name }}` and persists in
        `/etc/fstab`. For each requested mount, the EBS volume requires
        a `Purpose` tag to have been set (e.g. using Terraform).
    options:
      storage_lvm_mount_points:
        type: list
        elements: dict
        required: true
        description: List of mount definitions. Must be non-empty.
        options:
          name:
            type: str
            required: true
            description: >-
              The EBS Purpose tag value to match (e.g. u01). Also used as the
              mount path (the volume will be mounted at /{{ name }}).
          vg:
            type: str
            required: true
            description: Volume group name.
          lv:
            type: str
            required: true
            description: Logical volume name.

          fstype:
            type: str
            required: false
            description: >-
              Filesystem type. Defaults to storage_lvm_fstype.
          mount_opts:
            type: str
            required: false
            description: >-
              Mount options passed to mount(8) and written to /etc/fstab.
              Defaults to storage_lvm_mount_opts.
          pe_size:
            type: int
            required: false
            description: >-
              Physical extent size for the VG, in MB.
              Defaults to storage_lvm_pe_size.
          mode:
            type: str
            required: false
            description: >-
              Permissions for the mount directory.
              Defaults to storage_lvm_mount_mode.
          owner:
            type: str
            required: false
            description: >-
              Owning user for the mount directory.
              Defaults to storage_lvm_mount_owner.
          group:
            type: str
            required: false
            description: >-
              Owning group for the mount directory.
              Defaults to storage_lvm_mount_group.

      storage_lvm_aws_region:
        type: str
        required: false
        description: >-
          AWS region used when querying ec2_vol_info (e.g. eu-west-1).
      storage_lvm_debugging_enabled:
        type: bool
        required: false
        default: false
        description: Emit verbose debug output.
      storage_lvm_fstype:
        type: str
        required: false
        default: xfs
        description: Default filesystem type.
      storage_lvm_mount_opts:
        type: str
        required: false
        default: "defaults,nofail"
        description: Default mount options.
      storage_lvm_pe_size:
        type: int
        required: false
        default: 4
        description: Default physical extent size in MB.
      storage_lvm_mount_mode:
        type: str
        required: false
        default: "0755"
        description: Default permissions for mount directories.
      storage_lvm_mount_owner:
        type: str
        required: false
        default: root
        description: Default owning user for mount directories.
      storage_lvm_mount_group:
        type: str
        required: false
        default: root
        description: Default owning group for mount directories.
