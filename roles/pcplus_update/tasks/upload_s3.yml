---
- name: Upload PCPlus data folder to S3
  ansible.builtin.command:
    cmd: >
      aws s3 cp --recursive "{{ pcplus_extract_path }}/pcplus/data/" "s3://{{ pcplus_s3_bucket }}/{{ pcplus_s3_prefix }}/{{ pcplus_new_folder }}/"
  register: upload_result

- name: Debug upload output
  ansible.builtin.debug:
    var: upload_result.stdout
