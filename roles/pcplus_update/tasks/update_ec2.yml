---
- name: Create new quarter directory on EC2
  ansible.builtin.file:
    path: "{{ pcplus_ec2_install_path }}/data_{{ pcplus_new_folder }}"
    state: directory
    mode: "0755"

- name: Sync data from S3 to EC2
  ansible.builtin.command:
    cmd: >
      aws s3 cp --recursive "s3://{{ pcplus_s3_bucket }}/{{ pcplus_s3_prefix }}/{{ pcplus_new_folder }}/" "{{ pcplus_ec2_install_path }}/data_{{ pcplus_new_folder }}/"
  register: ec2_sync

- name: Check for license file
  ansible.builtin.command:
    cmd: "ls {{ pcplus_ec2_install_path }}/data_{{ pcplus_new_folder }}/"
  register: ls_output

- name: Copy license if missing
  ansible.builtin.copy:
    src: "{{ pcplus_ec2_install_path }}/pcplus.lic"
    dest: "{{ pcplus_ec2_install_path }}/data_{{ pcplus_new_folder }}/pcplus.lic"
  when: "'pcplus.lic' not in ls_output.stdout"

- name: Fix permissions
  ansible.builtin.file:
    path: "{{ pcplus_ec2_install_path }}/data_{{ pcplus_new_folder }}"
    recurse: true
    mode: "0755"
    owner: root
    group: root

- name: Rotate folders — archive old data
  ansible.builtin.command:
    cmd: >
      mv data data_{{ pcplus_new_folder }}
  args:
    chdir: "{{ pcplus_ec2_install_path }}"
  failed_when: true

- name: Move new data into live position
  ansible.builtin.command:
    cmd: >
      mv data_{{ pcplus_new_folder }} data
  args:
    chdir: "{{ pcplus_ec2_install_path }}"
